<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mindy 的素材整理網站">
  <title>Mindy 素材整理網站</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3ee;
      color: #292522;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #f7d9c4 0, transparent 34%),
        radial-gradient(circle at bottom right, #cde7df 0, transparent 36%),
        #f7f3ee;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(36px, 8vw, 72px);
      border: 1px solid rgba(41, 37, 34, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(70, 59, 48, 0.12);
      backdrop-filter: blur(12px);
    }

    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #292522;
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(36px, 8vw, 68px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #665d56;
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">MINDY ASSET HUB</span>
    <h1>素材整理網站</h1>
    <p>網站已成功上線。你可以從這裡開始整理、展示與管理自己的素材。</p>
  </main>
</body>
</html>
